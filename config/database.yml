# Primary app data lives on GreptimeDB (PostgreSQL wire protocol, port 4003).
# solid_queue keeps a real PostgreSQL database under the `queue` role.
#
# Greptime:
#   GREPTIME_HOST (default: 127.0.0.1)
#   GREPTIME_PORT (default: 4003)
#   GREPTIME_DATABASE (default: public)
#   GREPTIME_USERNAME / GREPTIME_PASSWORD (optional)
#   Or set DATABASE_URL=postgres://user:pass@host:4003/public
#
# Queue (PostgreSQL):
#   QUEUE_DATABASE_URL or standard host/user/password below

default_greptime: &default_greptime
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("GREPTIME_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("GREPTIME_PORT", 4003) %>
  database: <%= ENV.fetch("GREPTIME_DATABASE", "public") %>
  username: <%= ENV.fetch("GREPTIME_USERNAME", nil) %>
  password: <%= ENV.fetch("GREPTIME_PASSWORD", nil) %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  greptimedb: true
  # Greptime is not managed by Active Record migrations.
  migrations_paths: db/greptime_migrate
  schema_dump: false


default_postgres: &default_postgres
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default_greptime
  queue:
    <<: *default_postgres
    database: jorm_observability_development_queue
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default_greptime
    database: <%= ENV.fetch("GREPTIME_TEST_DATABASE", ENV.fetch("GREPTIME_DATABASE", "public")) %>
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 12 } %>
  queue:
    <<: *default_postgres
    database: jorm_observability_test_queue
    migrations_paths: db/queue_migrate


production:
  primary:
    <<: *default_greptime
    <% if ENV["DATABASE_URL"].present? %>
    url: <%= ENV["DATABASE_URL"] %>
    <% end %>
  queue:
    <<: *default_postgres
    database: jorm_observability_production_queue
    username: jorm_observability
    password: <%= ENV["JORM_OBSERVABILITY_DATABASE_PASSWORD"] %>
    <% if ENV["QUEUE_DATABASE_URL"].present? %>
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    <% end %>
    migrations_paths: db/queue_migrate

