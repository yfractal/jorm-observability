services:
  greptimedb:
    image: greptime/greptimedb:v1.4.0-nightly-20261028
    command: standalone start --http-addr 0.0.0.0:4000 --rpc-bind-addr 0.0.0.0:4001 --mysql-addr 0.0.0.0:4002 --postgres-addr 0.0.0.0:4003
    ports:
      - "4000:4000"
      - "4001:4001"
      - "4002:4002"
      - "4003:4003"

    volumes:
      - greptime_data:/tmp/greptimedb

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jorm
      POSTGRES_PASSWORD: jorm
      POSTGRES_DB: jorm_observability_development_queue
    ports:
      - "5432:5432"
    volumes:
      - postgres_queue_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "5001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  greptime_data:
  postgres_queue_data:
  grafana_data:
