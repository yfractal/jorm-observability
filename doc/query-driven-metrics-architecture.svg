<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 680" role="img" aria-labelledby="title desc">
  <title id="title">Query-driven metrics architecture</title>
  <desc id="desc">Write path injects spans into a metric store. Query path hybrid-reads the metric through now minus 5 minutes and concatenates a trace tail.</desc>
  <style>
    .bg { fill: #fafafa; }
    .node { fill: #f0f0f0; }
    .ink { fill: #1a1a1a; }
    .muted { fill: #5c5c5c; }
    .arrow { fill: none; stroke: #3d3d3d; stroke-width: 1.5; }
    .read { fill: none; stroke: #5a6cc0; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .write { stroke: #2a9a8a; }
    .query { stroke: #2e79b5; }
    .shared { stroke: #5a6cc0; }
    .write-text { fill: #2a9a8a; }
    .query-text { fill: #2e79b5; }
    .bar { stroke: #3d3d3d; }
    .metric-fill { fill: #e8f0f6; }
    .tail-fill { fill: #e6f4f2; }
    .cut { stroke: #5a6cc0; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1b; }
      .node { fill: #2a2a2a; }
      .ink { fill: #f0f0f0; }
      .muted { fill: #a3a3a3; }
      .arrow { stroke: #c8c8c8; }
      .bar { stroke: #c8c8c8; }
      .metric-fill { fill: #243444; }
      .tail-fill { fill: #1e3331; }
    }
  </style>
  <rect class="bg" width="752" height="680"/>
  <text x="16" y="28" class="ink" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Query-driven metrics architecture</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <rect x="16" y="42" width="10" height="10" rx="2" fill="#2a9a8a"/>
    <text x="32" y="52" class="muted">Write path</text>
    <rect x="120" y="42" width="10" height="10" rx="2" fill="#2e79b5"/>
    <text x="136" y="52" class="muted">Query path</text>
    <rect x="228" y="42" width="10" height="10" rx="2" fill="#5a6cc0"/>
    <text x="244" y="52" class="muted">Shared metric</text>
  </g>

  <g transform="translate(16, 64)" font-family="ui-sans-serif, system-ui, sans-serif">
    <defs>
      <marker id="arrow-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6b7280"/>
      </marker>
    </defs>
    <text x="16" y="14" class="write-text" font-size="12" font-weight="500">Write</text>
    <text x="500" y="14" class="query-text" font-size="12" font-weight="500">Query</text>

    <path class="arrow" marker-end="url(#arrow-head)" d="M 360 62 V 74 H 116 V 92"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 360 62 V 74 H 600 V 92"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 116 142 V 172"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 116 222 V 237 H 204 V 252"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 116 222 V 237 H 336 V 252"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 128 277 H 140"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 204 302 V 332"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 336 302 V 332"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 600 142 V 157 H 488 V 172"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 600 142 V 157 H 632 V 172"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 488 222 V 237 H 560 V 252"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 632 222 V 237 H 560 V 252"/>
    <path class="arrow" marker-end="url(#arrow-head)" d="M 560 302 V 332"/>
    <path class="read" marker-end="url(#arrow-head)" d="M 392 357 H 406 V 197 H 420"/>
    <text x="372" y="192" class="muted" font-size="11">read</text>

    <g>
      <rect class="node query" x="260" y="12" width="200" height="50" rx="6" fill="#f0f0f0" stroke="#2e79b5" stroke-width="1.5"/>
      <text x="360" y="32" text-anchor="middle" class="ink" font-size="12" font-weight="500">SQL query</text>
      <text x="360" y="50" text-anchor="middle" class="muted" font-size="11">incoming analytics</text>
    </g>
    <g>
      <rect class="node query" x="16" y="92" width="200" height="50" rx="6" fill="#f0f0f0" stroke="#2e79b5" stroke-width="1.5"/>
      <text x="116" y="112" text-anchor="middle" class="ink" font-size="12" font-weight="500">Determine metric</text>
      <text x="116" y="130" text-anchor="middle" class="muted" font-size="11">avoid aggregation</text>
    </g>
    <g>
      <rect class="node query" x="500" y="92" width="200" height="50" rx="6" fill="#f0f0f0" stroke="#2e79b5" stroke-width="1.5"/>
      <text x="600" y="112" text-anchor="middle" class="ink" font-size="12" font-weight="500">Hybrid query</text>
      <text x="600" y="130" text-anchor="middle" class="muted" font-size="11">metric + traces</text>
    </g>
    <g>
      <rect class="node shared" x="16" y="172" width="200" height="50" rx="6" fill="#f0f0f0" stroke="#5a6cc0" stroke-width="1.5"/>
      <text x="116" y="192" text-anchor="middle" class="ink" font-size="12" font-weight="500">Metric definition</text>
      <text x="116" y="210" text-anchor="middle" class="muted" font-size="11">materialized view</text>
    </g>
    <g>
      <rect class="node query" x="420" y="172" width="136" height="50" rx="6" fill="#f0f0f0" stroke="#2e79b5" stroke-width="1.5"/>
      <text x="488" y="192" text-anchor="middle" class="ink" font-size="12" font-weight="500">Metric query</text>
      <text x="488" y="210" text-anchor="middle" class="muted" font-size="11">end = now - 5 min</text>
    </g>
    <g>
      <rect class="node write" x="564" y="172" width="136" height="50" rx="6" fill="#f0f0f0" stroke="#2a9a8a" stroke-width="1.5"/>
      <text x="632" y="192" text-anchor="middle" class="ink" font-size="12" font-weight="500">Trace query</text>
      <text x="632" y="210" text-anchor="middle" class="muted" font-size="11">uncovered tail</text>
    </g>
    <g>
      <rect class="node write" x="16" y="252" width="112" height="50" rx="6" fill="#f0f0f0" stroke="#2a9a8a" stroke-width="1.5"/>
      <text x="72" y="272" text-anchor="middle" class="ink" font-size="12" font-weight="500">Span created</text>
      <text x="72" y="290" text-anchor="middle" class="muted" font-size="11">live ingest</text>
    </g>
    <g>
      <rect class="node write" x="140" y="252" width="128" height="50" rx="6" fill="#f0f0f0" stroke="#2a9a8a" stroke-width="1.5"/>
      <text x="204" y="272" text-anchor="middle" class="ink" font-size="12" font-weight="500">Maintain metric</text>
      <text x="204" y="290" text-anchor="middle" class="muted" font-size="11">span-to-metric</text>
    </g>
    <g>
      <rect class="node write" x="280" y="252" width="112" height="50" rx="6" fill="#f0f0f0" stroke="#2a9a8a" stroke-width="1.5"/>
      <text x="336" y="272" text-anchor="middle" class="ink" font-size="12" font-weight="500">Backfill</text>
      <text x="336" y="290" text-anchor="middle" class="muted" font-size="11">complete buckets</text>
    </g>
    <g>
      <rect class="node shared" x="420" y="252" width="280" height="50" rx="6" fill="#f0f0f0" stroke="#5a6cc0" stroke-width="1.5"/>
      <text x="560" y="272" text-anchor="middle" class="ink" font-size="12" font-weight="500">Concatenate</text>
      <text x="560" y="290" text-anchor="middle" class="muted" font-size="11">metric + traces</text>
    </g>
    <g>
      <rect class="node shared" x="16" y="332" width="376" height="50" rx="6" fill="#f0f0f0" stroke="#5a6cc0" stroke-width="1.5"/>
      <text x="204" y="352" text-anchor="middle" class="ink" font-size="12" font-weight="500">Metric store</text>
      <text x="204" y="370" text-anchor="middle" class="muted" font-size="11">in-memory or DB</text>
    </g>
    <g>
      <rect class="node query" x="420" y="332" width="280" height="50" rx="6" fill="#f0f0f0" stroke="#2e79b5" stroke-width="1.5"/>
      <text x="560" y="352" text-anchor="middle" class="ink" font-size="12" font-weight="500">Result</text>
      <text x="560" y="370" text-anchor="middle" class="muted" font-size="11">no live aggregation</text>
    </g>
  </g>

  <g transform="translate(16, 510)" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="16" class="ink" font-size="14" font-weight="600">Hybrid merge window</text>
    <clipPath id="merge-clip">
      <rect x="0" y="32" width="720" height="56" rx="6"/>
    </clipPath>
    <g clip-path="url(#merge-clip)">
      <rect class="metric-fill" x="0" y="32" width="540" height="56"/>
      <rect class="tail-fill" x="540" y="32" width="180" height="56"/>
    </g>
    <rect class="bar" x="0" y="32" width="720" height="56" rx="6" fill="none" stroke-width="1"/>
    <line class="cut" x1="540" y1="32" x2="540" y2="88" stroke-width="2"/>
    <text x="270" y="65" text-anchor="middle" class="query-text" font-size="12" font-weight="500">Metric coverage</text>
    <text x="630" y="65" text-anchor="middle" class="write-text" font-size="12" font-weight="500">Trace tail</text>
    <text x="0" y="114" class="muted" font-size="12">complete buckets</text>
    <text x="540" y="114" text-anchor="middle" class="ink" font-size="12" font-weight="600">now - 5 min</text>
    <text x="720" y="114" text-anchor="end" class="muted" font-size="12">now</text>
  </g>
</svg>
